    <script>
      // /motorstudio opens on the black intro, so paint black before React mounts (no white flash).
      // LocationShowcase restores the page background when the intro ends.
      if (location.pathname.replace(/\/+$/, "") === "/motorstudio") {
        document.documentElement.style.background = "#0f0f0f";
        document.documentElement.style.scrollbarGutter = "stable";
      }
    </script>
